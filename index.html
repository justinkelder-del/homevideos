<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elder Home Videos</title>
  <style>
    :root { --max: 1100px; --radius: 14px; }
    * { box-sizing: border-box; }

    body {
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#0b0d12;
      color:#eef2ff;
    }

    header {
      padding: 28px 18px 10px;
      max-width: var(--max);
      margin: 0 auto;
    }

    h1 { margin:0 0 10px; font-size: 28px; }
    p { margin: 0 0 14px; opacity: .8; }

    input {
      width:100%;
      padding:12px 14px;
      border-radius: 12px;
      border: 1px solid #2a3242;
      background:#0f1420;
      color:#eef2ff;
      outline:none;
    }

    main {
      padding: 0 18px 40px;
      max-width: var(--max);
      margin: 0 auto;
    }

    .section { margin-top: 18px; }
    .section h2 { font-size: 16px; margin: 0 0 10px; }

    .rail {
      display:flex;
      gap:12px;
      overflow-x:auto;
      padding-bottom:10px;
      -webkit-overflow-scrolling: touch;
    }

    .rail::-webkit-scrollbar { height:8px; }
    .rail::-webkit-scrollbar-thumb { background:#2a3242; border-radius:999px; }

    .card {
      flex: 0 0 auto;
      width: 340px;
      cursor:pointer;
      transition: transform .15s ease;
    }
    .card:hover { transform: scale(1.05); }

    .thumb {
      width:100%;
      height:190px;
      object-fit:cover;
      border-radius: var(--radius);
      display:block;
      background:#000;
    }

    .title {
      font-size: 13px;
      margin-top:6px;
      opacity:.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .modal.active { display:flex; }

    .modal-content {
      width: 100%;
      max-width: 900px;
      background:#000;
      border-radius: var(--radius);
      overflow:hidden;
      position: relative;
      border: 1px solid #2a3242;
    }

    .modal iframe {
      width:100%;
      aspect-ratio: 16/9;
      border:0;
      display:block;
    }

    .close-btn {
      position:absolute;
      top:10px;
      right:14px;
      font-size:28px;
      line-height: 1;
      color:#fff;
      cursor:pointer;
      user-select:none;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0,0,0,.35);
    }

    @media (max-width:600px){
      .card { width:240px; }
      .thumb { height:140px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Elder Home Videos</h1>
    <p>Click a thumbnail to play inside the site.</p>
    <input id="search" type="search" placeholder="Search videos…" />
  </header>

  <main>
    <div class="section">
      <h2>All Videos</h2>
      <div class="rail" id="videoRow"></div>
    </div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-label="Video player">
      <div class="close-btn" id="closeBtn" aria-label="Close">&times;</div>
      <iframe id="videoFrame"
        src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <script>
    // Your videos
    const videos = [
      { id: "xmB4ypSYQ9M", title: "1982: Justin Arrives Home" },
      { id: "kN3QqzN2Tsg", title: "1994: Birthdays & Family Fun" },
      { id: "FOfIbEYPZdc", title: "1990: Christmas" },
      { id: "feHz6uVy36c", title: "1991: East Coast Vacation" },
      
    ];

    const row = document.getElementById("videoRow");
    const search = document.getElementById("search");
    const modal = document.getElementById("modal");
    const frame = document.getElementById("videoFrame");
    const closeBtn = document.getElementById("closeBtn");

    function thumbUrl(id) {
      return "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
    }

    function openModal(id) {
      // autoplay=1 plays immediately; modestbranding reduces YouTube chrome a bit
      frame.src = "https://www.youtube.com/embed/" + id + "?autoplay=1&modestbranding=1";
      modal.classList.add("active");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      frame.src = ""; // stop playback
      modal.classList.remove("active");
      modal.setAttribute("aria-hidden", "true");
    }

    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    function render(list) {
      row.innerHTML = "";
      list.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";
        card.addEventListener("click", () => openModal(v.id));

        const img = document.createElement("img");
        img.className = "thumb";
        img.src = thumbUrl(v.id);
        img.alt = v.title;

        const t = document.createElement("div");
        t.className = "title";
        t.textContent = v.title;

        card.appendChild(img);
        card.appendChild(t);
        row.appendChild(card);
      });
    }

    search.addEventListener("input", () => {
      const q = (search.value || "").toLowerCase().trim();
      if (!q) return render(videos);
      render(videos.filter(v => (v.title || "").toLowerCase().includes(q) || v.id.toLowerCase().includes(q)));
    });

    render(videos);
  </script>
</body>
</html>
