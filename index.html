<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Video Library</title>

<style>
:root { --max: 1100px; --radius: 14px; }
* { box-sizing: border-box; }

body {
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:#0b0d12;
  color:#eef2ff;
}

header {
  padding: 28px 18px 10px;
  max-width: var(--max);
  margin: 0 auto;
}

h1 { margin:0 0 10px; font-size: 28px; }

input {
  width:100%;
  padding:12px 14px;
  border-radius: 12px;
  border: 1px solid #2a3242;
  background:#0f1420;
  color:#eef2ff;
  outline:none;
}

main {
  padding: 0 18px 40px;
  max-width: var(--max);
  margin: 0 auto;
}

.section { margin-top: 20px; }
.section h2 { font-size: 16px; margin-bottom: 10px; }

.rail {
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
}

.rail::-webkit-scrollbar { height:8px; }
.rail::-webkit-scrollbar-thumb {
  background:#2a3242;
  border-radius:999px;
}

.card {
  flex: 0 0 auto;
  width: 220px;
  cursor:pointer;
  transition: transform .15s ease;
}

.card:hover { transform: scale(1.05); }

.thumb {
  width:100%;
  height:125px;
  object-fit:cover;
  border-radius: var(--radius);
}

.title {
  font-size: 13px;
  margin-top:6px;
  opacity:.9;
}

/* Modal Overlay */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}

.modal.active {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 900px;
  background:#000;
  border-radius: var(--radius);
  overflow:hidden;
  position: relative;
}
